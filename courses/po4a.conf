# Source unique : courses/en/*.md. La traduction vit dans po/fr.po ;
# courses/fr/*.md en est le rendu, jamais édité à la main.
#
# Les trois options ne sont pas négociables, elles viennent d'un round-trip
# cassé puis réparé (po4a 0.69) :
#   -o markdown    sinon le fichier est traité comme du texte brut
#   -o neverwrap   sinon les tableaux Markdown sont aplatis et détruits
#   -M UTF-8       sinon tout caractère non-ASCII devient du mojibake

# --keep 0 n'est pas négociable : sans lui, po4a supprime la traduction sous
# 80 % de complétude. tools/check-courses.mjs le vérifie (checkPo4aOptions)
# sans en dépendre lui-même pour sa propre justesse — son contrôle de dérive
# rend dans une copie temporaire isolée, où l'absence de cette option est
# fail-closed : courses/fr/ y est vide au départ, donc tout fichier attendu y
# ressort comme manquant plutôt que de passer en silence.
#
# --force n'est volontairement pas ici : posé dans [options], po4a réécrirait
# courses.pot avec un horodatage neuf à chaque build même sans rien à
# régénérer, cassant l'idempotence de npm run build:courses. Il est donc passé
# explicitement en argument aux deux invocations qui en ont besoin : le script
# build:courses (package.json) et la passe --no-update du contrôle isolé
# (tools/check-courses.mjs), jamais ici.
[options] --keep 0

[po4a_langs] fr
[po4a_paths] courses/po/courses.pot $lang:courses/po/$lang.po

[type: text] courses/en/00-api-foundations.md $lang:courses/fr/00-api-foundations.md opt:"-o markdown -o neverwrap -M UTF-8"
[type: text] courses/en/01-orchestration.md $lang:courses/fr/01-orchestration.md opt:"-o markdown -o neverwrap -M UTF-8"
[type: text] courses/en/02-tools-mcp.md $lang:courses/fr/02-tools-mcp.md opt:"-o markdown -o neverwrap -M UTF-8"
[type: text] courses/en/03-claude-code-config.md $lang:courses/fr/03-claude-code-config.md opt:"-o markdown -o neverwrap -M UTF-8"
[type: text] courses/en/04-prompt-engineering.md $lang:courses/fr/04-prompt-engineering.md opt:"-o markdown -o neverwrap -M UTF-8"
