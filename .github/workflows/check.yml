name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci
      - run: sudo apt-get update && sudo apt-get install -y po4a
      - run: npm test
      - run: npm run check
      # Les rapports informent, ils ne décident pas : leur sortie est lisible
      # dans le log du job sans jamais faire échouer la CI.
      - run: npm run report
        continue-on-error: true
